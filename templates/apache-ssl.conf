# {{DOMAIN}} SSL virtual host
<VirtualHost *:443>
    ServerName {{DOMAIN}}
    ServerAlias www.{{DOMAIN}}
    DocumentRoot {{DOCROOT}}

    # SSL Configuration (Cloudflare Origin cert covers apex + www)
    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare-origin/certs/{{SAFE_NAME}}.crt
    SSLCertificateKeyFile /etc/ssl/cloudflare-origin/keys/{{SAFE_NAME}}.key

    <Directory {{DOCROOT}}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/{{SAFE_NAME}}_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/{{SAFE_NAME}}_ssl_access.log combined
</VirtualHost>
